name: Release

# Previously tag/build-and-push/deploy ran as three separate needs-chained
# jobs. Each job boundary means GitHub tears down the runner and provisions
# a fresh one for the next job -- on 2026-09-04 that handoff cost ~70s
# between `tag` and `build-and-push` alone, versus ~48s of actual work
# across all three steps combined. Collapsed into one job/one runner to
# remove that queuing overhead. See release.yml.bak for the original.
#
# Build step also uses the GitHub Actions cache backend (cache-from/
# cache-to: type=gha) so unchanged Docker layers don't rebuild on every
# push -- Dockerfile-dependency layers (base image, apt/pip installs)
# are reused; only layers after the first changed COPY actually rebuild.
on:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next
        run: |
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.next.outputs.version }}"
          git push origin "${{ steps.next.outputs.version }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/dcomforter/dcomforters-kitchen:${{ steps.next.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: Dcomforter/dcomforters-kitchen-config
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: config-repo

      - name: Bump image tag
        working-directory: config-repo
        run: |
          sed -i "s|image: ghcr.io/dcomforter/dcomforters-kitchen:.*|image: ghcr.io/dcomforter/dcomforters-kitchen:${{ steps.next.outputs.version }}|" \
            apps/dcomforters/overlays/production/deployment-patch.yaml

      - name: Commit and push
        working-directory: config-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/dcomforters/overlays/production/deployment-patch.yaml
          git commit -m "Bump production image to ${{ steps.next.outputs.version }}" || exit 0
          git push
